name: DB migrate

# Applies pending migrations in ./drizzle to the production database after a
# PR is merged to main. Already-applied migrations are skipped, so re-running
# is safe. Can also be started by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once, and never
# cancel one halfway through.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for the 'production' environment."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
